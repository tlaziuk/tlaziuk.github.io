name: Deno CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install dependencies
        run: deno install --frozen-lockfile
      - name: Check (format, lint, types)
        run: deno task check
      - name: Build
        run: deno task build
